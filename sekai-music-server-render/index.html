<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sekai Music Server</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b0d12;color:#f5f7fb}main{max-width:900px;margin:auto;padding:28px 18px}.card{background:#121620;border:1px solid #242a38;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 12px 40px #0004}h1{margin:0 0 6px;font-size:28px}.muted{color:#9da6b8}label{display:block;margin:14px 0 7px;font-size:13px;color:#b8c0d0}input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #303747;background:#0d1119;color:white}button{border:0;border-radius:13px;padding:13px 18px;background:#fff;color:#111;font-weight:700;cursor:pointer;margin-top:16px}.drop{border:1px dashed #59657b;padding:24px;border-radius:16px;text-align:center}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:650px){.row{grid-template-columns:1fr}}.track{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #252b38}.cover{width:54px;height:54px;object-fit:cover;border-radius:10px;background:#202633}.track b{display:block}.track span{color:#8f99ab;font-size:13px}#status{margin-top:12px;color:#aeb8c9}.danger{background:#272d3a;color:#fff;margin:0;padding:8px 11px;font-size:12px}
</style></head><body><main>
<div class="card"><h1>🎵 Sekai Music Server</h1><p class="muted">Sube canciones desde aquí. Sekai consultará este servidor mediante <code>/api/catalog</code>.</p><div id="count" class="muted">Cargando catálogo...</div></div>
<div class="card"><h2>Subir canción</h2><form id="form"><div class="drop"><input id="song" name="song" type="file" accept="audio/*" required></div><div class="row"><div><label>Título</label><input name="title" placeholder="Se detecta del nombre si lo dejas vacío"></div><div><label>Artista</label><input name="artist" placeholder="Artista"></div></div><div class="row"><div><label>Álbum</label><input name="album" placeholder="Opcional"></div><div><label>Año</label><input name="year" placeholder="Opcional"></div></div><label>Cover</label><input name="cover" type="file" accept="image/jpeg,image/png,image/webp"><button type="submit">Subir canción</button><div id="status"></div></form></div>
<div class="card"><h2>Catálogo</h2><div id="list"></div></div>
<script>
const $=s=>document.querySelector(s); async function load(){const r=await fetch('/api/catalog');const j=await r.json();$('#count').textContent=j.total+' canción(es)';$('#list').innerHTML=j.data.map(t=>`<div class="track"><img class="cover" src="${t.cover||''}" onerror="this.style.visibility='hidden'"><div style="flex:1"><b>${esc(t.title)}</b><span>${esc(t.artist)}${t.album?' · '+esc(t.album):''}</span></div><button class="danger" onclick="del('${t.id}')">Eliminar</button></div>`).join('')||'<p class="muted">Todavía no hay canciones.</p>'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('#form').onsubmit=async e=>{e.preventDefault();$('#status').textContent='Subiendo...';const r=await fetch('/api/upload',{method:'POST',body:new FormData(e.target)});const j=await r.json();$('#status').textContent=r.ok?'✓ Canción guardada en el servidor':'✕ '+(j.error||'Error');if(r.ok){e.target.reset();load()}};async function del(id){if(!confirm('¿Eliminar esta canción?'))return;await fetch('/api/tracks/'+encodeURIComponent(id),{method:'DELETE'});load()}load();
</script></main></body></html>
